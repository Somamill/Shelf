name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to package and publish
        required: true
        type: string

concurrency:
  group: shelf-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Prepare verified updater signing
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Configure SPARKLE_PRIVATE_KEY using Scripts/setup-updater-signing.sh on the developer Mac.' >&2; exit 1; }
          python3 - <<'PYTAG'
          import os,pathlib,re,sys
          version=re.search(r'MARKETING_VERSION: ([0-9.]+)',pathlib.Path('project.yml').read_text()).group(1)
          if os.environ['RELEASE_TAG']!='v'+version:sys.exit('Release tag does not match the app version')
          PYTAG
          umask 077
          python3 - <<'PYKEY'
          import os,base64,sys
          try:
              valid=len(base64.b64decode(os.environ.get('SPARKLE_PRIVATE_KEY','').strip(),validate=True))==32
          except Exception:
              valid=False
          if not valid:
              sys.exit('Invalid Sparkle signing seed; no key was printed.')
          PYKEY
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          swift Scripts/configure-updater.swift Config/Shelf-Info.plist < "$RUNNER_TEMP/sparkle.key" > "$RUNNER_TEMP/sparkle-public-key.txt"
          bash Scripts/download-sparkle.sh "$RUNNER_TEMP/Sparkle"
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/previous-release.json"
          python3 - "$RUNNER_TEMP/previous-release.json" "$RELEASE_TAG" <<'PYVERSION'
          import json,re,sys
          previous=json.load(open(sys.argv[1]))
          def version(s):
              if not re.fullmatch(r'v\d+\.\d+\.\d+',s):sys.exit('Use a new stable vMAJOR.MINOR.PATCH tag')
              return tuple(map(int,s[1:].split('.')))
          if version(sys.argv[2])<=version(previous['tagName']):sys.exit('Refusing to publish a version older than or equal to the current release')
          has_key=any(a['name']=='sparkle-public-key.txt' for a in previous['assets'])
          if not has_key and version(previous['tagName'])>(0,2,0):sys.exit('Previous updater signing key is missing; investigate rather than rotating it silently')
          PYVERSION
          if python3 - "$RUNNER_TEMP/previous-release.json" <<'PYPREV'
          import json,sys
          sys.exit(0 if any(a['name']=='sparkle-public-key.txt' for a in json.load(open(sys.argv[1]))['assets']) else 1)
          PYPREV
          then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern sparkle-public-key.txt --dir "$RUNNER_TEMP/previous-updater"
            cmp "$RUNNER_TEMP/previous-updater/sparkle-public-key.txt" "$RUNNER_TEMP/sparkle-public-key.txt" || { echo 'Update signing key changed. Use a supported key-rotation plan instead.' >&2; exit 1; }
            gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$RUNNER_TEMP/previous-updater"
            "$RUNNER_TEMP/Sparkle/bin/sign_update" --verify --ed-key-file "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/previous-updater/appcast.xml"
            python3 - "$RUNNER_TEMP/previous-updater/appcast.xml" <<'PYBUILD'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          ns='{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          versions=[int(x.text) for x in ET.parse(sys.argv[1]).getroot().iter(ns+'version')]
          build=int(re.search(r'CURRENT_PROJECT_VERSION: (\d+)',pathlib.Path('project.yml').read_text()).group(1))
          if not versions or build<=max(versions):sys.exit('Increase CURRENT_PROJECT_VERSION before publishing an update')
          PYBUILD
          fi
      - name: Check Apple signing secrets
        id: signing-check
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Using unsigned community build::Configure Apple signing secrets to publish a signed and notarized app. Missing: ${missing[*]}"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare bundled universal Python runtime
        run: Scripts/download-python-runtime.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project .
      - name: Build unsigned app for community distribution
        if: steps.signing-check.outputs.available != 'true'
        run: |
          xcodebuild -project Shelf.xcodeproj -scheme Shelf -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ShelfDerived" \
            CODE_SIGNING_ALLOWED=NO build
          APP_PATH="$RUNNER_TEMP/ShelfDerived/Build/Products/Release/Shelf.app"
          test -d "$APP_PATH"
          while IFS= read -r -d '' code_file; do
            if file "$code_file" | grep -q 'Mach-O'; then
              codesign --force --sign - "$code_file"
            fi
          done < <(find "$APP_PATH/Contents/Resources/PythonRuntime" -type f -print0)
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Shelf-${RELEASE_TAG}.zip"
          Scripts/package-dmg.sh "$APP_PATH" "$RUNNER_TEMP/Shelf.dmg"
      - name: Import Developer ID certificate
        if: steps.signing-check.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/shelf-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Archive signed app
        if: steps.signing-check.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project Shelf.xcodeproj -scheme Shelf -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Shelf.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES archive
      - name: Sign bundled Python and notarize the app
        if: steps.signing-check.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$RUNNER_TEMP/Shelf.xcarchive/Products/Applications/Shelf.app"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | sed -nE 's/.* ([A-F0-9]{40}) "Developer ID Application:.*"/\1/p' | head -n 1)"
          test -n "$SIGNING_IDENTITY"
          while IFS= read -r -d '' code_file; do
            if file "$code_file" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$code_file"
            fi
          done < <(find "$APP_PATH/Contents/Resources/PythonRuntime" -type f -print0)
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Shelf-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Shelf-notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Shelf-${RELEASE_TAG}.zip"
          Scripts/package-dmg.sh "$APP_PATH" "$RUNNER_TEMP/Shelf.dmg"
      - name: Sign update archive and appcast
        run: |
          mkdir -p "$RUNNER_TEMP/updater"
          cp "$RUNNER_TEMP/Shelf-${RELEASE_TAG}.zip" "$RUNNER_TEMP/updater/"
          python3 - "$RUNNER_TEMP/updater/Shelf-${RELEASE_TAG}.md" <<'PYNOTES'
          import pathlib,sys
          text=pathlib.Path('CHANGELOG.md').read_text()
          section=text.split('\n## ',1)[0]
          pathlib.Path(sys.argv[1]).write_text(section+'\n')
          PYNOTES
          "$RUNNER_TEMP/Sparkle/bin/generate_appcast" --ed-key-file "$RUNNER_TEMP/sparkle.key" --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" "$RUNNER_TEMP/updater"
          "$RUNNER_TEMP/Sparkle/bin/sign_update" --verify --ed-key-file "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/updater/appcast.xml"
      - name: Publish app and checksum to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RELEASE: ${{ steps.signing-check.outputs.available }}
        run: |
          if [[ "$SIGNED_RELEASE" == true ]]; then
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Shelf ${RELEASE_TAG#v}

          This notarized macOS release includes the app's universal Python runtimes; Xcode and a separate Python installation are not required.

          Verify the download with the SHA-256 checksum in \`Shelf.dmg.sha256\`.
          EOF
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Shelf ${RELEASE_TAG#v}

          This self-contained macOS DMG includes the app's universal Python runtimes; Xcode and a separate Python installation are not required.

          **Unsigned community build:** Apple Developer ID signing and notarization are not configured for this release. macOS Gatekeeper remains enabled and may block the first launch. To approve it, try opening Shelf once, then go to **System Settings → Privacy & Security → Open Anyway** and confirm. Only install software you trust. Do not remove the quarantine attribute or disable Gatekeeper.

          Verify the download with the SHA-256 checksum in \`Shelf.dmg.sha256\`.
          EOF
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --draft --repo "$GITHUB_REPOSITORY" --title "Shelf ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || { echo "Refusing to overwrite a published update" >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Shelf ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Shelf-${RELEASE_TAG}.zip" "$RUNNER_TEMP/Shelf.dmg" --repo "$GITHUB_REPOSITORY" --clobber
          shasum -a 256 "$RUNNER_TEMP/Shelf.dmg" | awk '{print $1 "  Shelf.dmg"}' > "$RUNNER_TEMP/Shelf.dmg.sha256"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Shelf.dmg.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/updater/appcast.xml" "$RUNNER_TEMP/updater/Shelf-${RELEASE_TAG}.md" "$RUNNER_TEMP/sparkle-public-key.txt" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Remove temporary update signing seed
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle.key"
