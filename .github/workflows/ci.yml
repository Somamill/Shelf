name: Build and validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build shared Swift package
        run: swift build
      - name: Validate scripts and dashboard JavaScript
        run: |
          python3 -m py_compile Sources/ShelfCore/Tools/*.py
          node --check Resources/Dashboard/app.js
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project .
      - name: Build macOS app
        run: xcodebuild -project Shelf.xcodeproj -scheme Shelf -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
