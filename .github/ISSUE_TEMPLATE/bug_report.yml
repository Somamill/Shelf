name: Bug report
description: Report a reproducible problem in Shelf
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove passwords, API keys, library paths, private IP addresses, and book files from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: Shelf version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error or log excerpt
      description: Remove all credentials and personal paths before pasting.
    validations:
      required: false
